<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>qount · 实时收益看板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><g fill='%23fff'><rect x='24' y='52' width='12' height='24'/><rect x='44' y='38' width='12' height='38'/><rect x='64' y='24' width='12' height='52'/></g></svg>">
<link rel="stylesheet" href="style.css">
<script>
  // apply saved/system theme before first paint (no flash)
  (function () {
    var t; try { t = localStorage.getItem("qount-theme"); } catch (e) {}
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo"><span class="dot">◆</span> qount</span>
    <span class="tag">实时收益看板</span>
  </div>
  <div class="meta">
    <span id="clock" class="clock">—</span>
    <button id="theme-btn" class="refresh" title="切换深色 / 浅色">☀</button>
    <button id="refresh" class="refresh" title="立即刷新">↻</button>
  </div>
</header>

<div class="ticker" id="ticker"></div>

<main id="app">
  <!-- 全局概览 -->
  <section class="overview" id="overview">
    <div class="otile"><div class="ok">A股 · 模拟盘</div><div class="oe">—</div></div>
    <div class="otile"><div class="ok">加密实盘</div><div class="oe">—</div></div>
    <div class="otile"><div class="ok">加密模拟盘</div><div class="oe">—</div></div>
  </section>

  <!-- A股 CTA-R -->
  <section class="panel" id="panel-cta">
    <div class="panel-head">
      <h2>A股 · CTA-R 跨资产组合</h2>
      <span class="badge paper">模拟盘</span>
    </div>
    <div class="panel-body" id="body-cta"><div class="skeleton">加载中…</div></div>
  </section>

  <!-- 加密实盘 -->
  <section class="panel" id="panel-live">
    <div class="panel-head">
      <h2>加密 · X4 固定 TOP7 趋势</h2>
      <span class="badge real">实盘</span>
    </div>
    <div class="panel-body" id="body-live"><div class="skeleton">加载中…</div></div>
  </section>

  <!-- 加密 C×D 合成账(趋势+carry) -->
  <section class="panel" id="panel-cxd">
    <div class="panel-head">
      <h2>加密 · C×D 合成账(趋势 + carry)</h2>
      <span class="badge real">实盘</span>
    </div>
    <div class="panel-body" id="body-cxd"><div class="skeleton">加载中…</div></div>
  </section>

  <!-- 加密模拟盘 -->
  <section class="panel" id="panel-paper">
    <div class="panel-head">
      <h2>加密 · X4 模拟盘(前向)</h2>
      <span class="badge paper">模拟盘</span>
    </div>
    <div class="panel-body" id="body-paper"><div class="skeleton">加载中…</div></div>
  </section>
</main>

<footer class="foot">
  <span>每分钟自动刷新 · A股 / 加密模拟盘为模拟,加密 live 为真实小仓</span>
</footer>

<script src="app.js"></script>
</body>
</html>
