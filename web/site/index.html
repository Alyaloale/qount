<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>qount · 监控台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><g fill='%23fff'><rect x='24' y='52' width='12' height='24'/><rect x='44' y='38' width='12' height='38'/><rect x='64' y='24' width='12' height='52'/></g></svg>">
<link rel="stylesheet" href="style.css">
<script>
  // apply saved/system theme before first paint (no flash)
  (function () {
    var t; try { t = localStorage.getItem("qount-theme"); } catch (e) {}
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div class="shell">
  <!-- ===== 侧边栏导航 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo"><span class="dot">◆</span> qount</span>
      <span class="tag">监控台</span>
    </div>
    <nav class="nav">
      <a class="nav-item" data-route="overview"><div class="ni-top"><span class="ni-ic">▦</span><span class="ni-label">概览</span></div></a>
      <a class="nav-item" data-route="live"><div class="ni-top"><span class="ni-ic">●</span><span class="ni-label">加密实盘</span><span class="ni-tag" id="nav-live-tag"></span></div><span class="ni-spark" id="spark-live"></span></a>
      <a class="nav-item" data-route="cta"><div class="ni-top"><span class="ni-ic">◆</span><span class="ni-label">A股 CTA-R</span></div><span class="ni-spark" id="spark-cta"></span></a>
      <a class="nav-item" data-route="cxd"><div class="ni-top"><span class="ni-ic">⊕</span><span class="ni-label">C×D 合成账</span></div></a>
      <a class="nav-item" data-route="paper"><div class="ni-top"><span class="ni-ic">◇</span><span class="ni-label">加密模拟盘</span></div><span class="ni-spark" id="spark-paper"></span></a>
    </nav>
    <div class="side-foot">
      <div class="side-status"><span class="live-dot"></span><span id="clock">—</span></div>
      <div class="side-ctrl">
        <button id="theme-btn" class="iconbtn" title="切换深色 / 浅色">☀</button>
        <button id="refresh" class="iconbtn" title="立即刷新">↻</button>
      </div>
    </div>
  </aside>

  <!-- ===== 内容区 ===== -->
  <main class="content">
    <header class="page-head">
      <button class="menu-btn iconbtn" id="menu-btn" title="菜单">☰</button>
      <h1 id="page-title">概览</h1>
      <div class="page-sub" id="page-sub"></div>
    </header>

    <section class="view" id="view-overview">
      <div class="sumcard" id="ov-summary"></div>
      <div class="overview" id="overview"></div>
      <div class="ov-note">点击任意卡片进入明细 · A股 / 加密模拟盘为模拟,加密实盘为真实小仓</div>
    </section>

    <section class="view" id="view-live" hidden>
      <div class="panel" id="panel-live">
        <div class="panel-head"><h2>加密 · X4 固定 TOP7 趋势</h2><span class="badge real">实盘</span></div>
        <div class="panel-body" id="body-live"><div class="skeleton">加载中…</div></div>
      </div>
    </section>

    <section class="view" id="view-cta" hidden>
      <div class="panel" id="panel-cta">
        <div class="panel-head"><h2>A股 · CTA-R 跨资产组合</h2><span class="badge paper">模拟盘</span></div>
        <div class="panel-body" id="body-cta"><div class="skeleton">加载中…</div></div>
      </div>
    </section>

    <section class="view" id="view-cxd" hidden>
      <div class="panel" id="panel-cxd">
        <div class="panel-head"><h2>加密 · C×D 合成账(趋势 + carry)</h2><span class="badge real">实盘</span></div>
        <div class="panel-body" id="body-cxd"><div class="skeleton">加载中…</div></div>
      </div>
    </section>

    <section class="view" id="view-paper" hidden>
      <div class="panel" id="panel-paper">
        <div class="panel-head"><h2>加密 · X4 模拟盘(前向)</h2><span class="badge paper">模拟盘</span></div>
        <div class="panel-body" id="body-paper"><div class="skeleton">加载中…</div></div>
      </div>
    </section>
  </main>
</div>
<div class="scrim" id="scrim"></div>

<script src="app.js"></script>
</body>
</html>
