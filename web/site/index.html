<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex, nofollow">
  <title>qount | 运行控制台</title>
  <link rel="stylesheet" href="style.css?v=25">
  <script>
    (function () {
      var saved;
      try { saved = localStorage.getItem("qount-theme"); } catch (error) {}
      var preferred = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", saved || preferred);
    })();
  </script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-block">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><strong>qount</strong><small>运行控制台</small></div>
      </div>

      <nav class="nav" aria-label="主导航">
        <a href="#/live" data-route="live"><span class="nav-key">01</span><span>实时状态</span></a>
        <a href="#/positions" data-route="positions"><span class="nav-key">02</span><span>仓位</span></a>
        <a href="#/orders" data-route="orders"><span class="nav-key">03</span><span>订单</span></a>
        <a href="#/strategies" data-route="strategies"><span class="nav-key">04</span><span>策略</span></a>
        <a href="#/decisions" data-route="decisions"><span class="nav-key">05</span><span>决策追踪</span></a>
        <a href="#/risk" data-route="risk"><span class="nav-key">06</span><span>风险</span></a>
        <a href="#/readiness" data-route="readiness"><span class="nav-key">07</span><span>就绪检查</span></a>
        <a href="#/system" data-route="system"><span class="nav-key">08</span><span>系统健康</span></a>
        <a href="#/alerts" data-route="alerts"><span class="nav-key">09</span><span>告警</span></a>
        <a href="#/reports" data-route="reports"><span class="nav-key">10</span><span>日报</span></a>
        <a href="#/intelligence" data-route="intelligence"><span class="nav-key">11</span><span>情报复盘</span></a>
      </nav>

      <div class="sidebar-foot">
        <div class="connection"><span class="signal pending" id="side-signal"></span><span id="side-status">等待权威发布</span></div>
        <div class="toolbar">
          <button class="icon-button" id="theme-button" type="button" title="切换主题" aria-label="切换主题"><span aria-hidden="true">◐</span></button>
          <button class="icon-button" id="refresh-button" type="button" title="刷新数据" aria-label="刷新数据"><span aria-hidden="true">↻</span></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" type="button" title="打开菜单" aria-label="打开菜单"><span aria-hidden="true">☰</span></button>
        <div class="title-block">
          <p class="eyebrow" id="page-eyebrow">权威读模型</p>
          <h1 id="page-title">实时运行</h1>
          <p id="page-subtitle">账户、组合与运行状态</p>
        </div>
        <div class="top-status">
          <span class="as-of" id="as-of">未加载</span>
          <span class="status-pill pending" id="freshness-badge" aria-live="polite">加载中</span>
        </div>
      </header>

      <div class="banner" id="error-banner" role="status" aria-live="polite" hidden></div>
      <section class="freshness-detail" id="freshness-detail" aria-label="当前模块来源时效" hidden></section>
      <section class="view" id="view-live" data-view="live"></section>
      <section class="view" id="view-positions" data-view="positions" hidden></section>
      <section class="view" id="view-orders" data-view="orders" hidden></section>
      <section class="view" id="view-strategies" data-view="strategies" hidden></section>
      <section class="view" id="view-decisions" data-view="decisions" hidden></section>
      <section class="view" id="view-risk" data-view="risk" hidden></section>
      <section class="view" id="view-readiness" data-view="readiness" hidden></section>
      <section class="view" id="view-system" data-view="system" hidden></section>
      <section class="view" id="view-alerts" data-view="alerts" hidden></section>
      <section class="view" id="view-reports" data-view="reports" hidden></section>
      <section class="view" id="view-intelligence" data-view="intelligence" hidden></section>
    </main>
  </div>
  <button class="scrim" id="scrim" type="button" aria-label="关闭菜单"></button>
  <script src="app.js?v=27"></script>
</body>
</html>
