# The authoritative, value-free environment-variable contract.  Do not put
# credentials, account identifiers, real endpoints, or confirmation values here.
# Every entry intentionally declares all fields consumed by config-check.

[contract]
version = 1
owner = "repository-governance"

[[variables]]
name = "QOUNT_MODE"
domain = "core"
type = "enum:paper|live"
sensitive = false
allowed_hosts = ["mac", "wsl", "vps"]
required_when = "never"
default_policy = "defaults_to_paper"
consumers = ["src/qount/settings.py"]
legacy = false

