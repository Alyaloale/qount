[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qount"
version = "0.2.4"
description = "AI decision trading system with a risk executor for Binance spot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.4.80",
  "openai>=1.82.0",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.25,<5",
]
research = [
  "numpy>=2.4.0",
  "scikit-learn>=1.9.0",
]
research-lightgbm = [
  "numpy>=2.4.0",
  "scikit-learn>=1.9.0",
  "lightgbm>=4.6.0",
]
research-regime = [
  "numpy>=2.4.0",
  "scipy>=1.17.0",
  "scikit-learn>=1.9.0",
  "lightgbm>=4.6.0",
  "xgboost>=3.2.0",
  "hmmlearn>=0.3.3",
]
research-neural = [
  "torch>=2.12.0,<2.14.0",
]
collector = [
  "websockets>=15.0,<17",
]

[project.scripts]
qount-run = "qount.main:main"
qount-monitor = "qount.mac_monitor:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
